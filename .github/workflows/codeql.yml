name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build analyzed solution
        shell: powershell
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File .\native\Build.ps1 -Configuration Release

      - uses: github/codeql-action/analyze@v4
