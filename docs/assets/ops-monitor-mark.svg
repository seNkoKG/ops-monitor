<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OPS Monitor logo</title>
  <desc id="desc">A compact dark monitor tile with cyan telemetry rails and a magenta sensor pulse.</desc>
  <defs>
    <linearGradient id="shell" x1="30" y1="18" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A27"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="cyan" x1="48" y1="56" x2="196" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67F6DD"/>
      <stop offset="1" stop-color="#28C7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="220" height="220" rx="58" fill="url(#shell)" stroke="#27364A" stroke-width="3"/>
  <circle cx="58" cy="56" r="7" fill="#59F0B7" filter="url(#glow)"/>
  <path d="M74 56h104" stroke="#243448" stroke-width="5" stroke-linecap="round"/>
  <rect x="47" y="78" width="162" height="47" rx="16" fill="#0D1823" stroke="#27D7F0" stroke-opacity=".45" stroke-width="2"/>
  <rect x="47" y="137" width="162" height="47" rx="16" fill="#121222" stroke="#F24DE7" stroke-opacity=".38" stroke-width="2"/>
  <path d="M62 101h22m-22 8h36" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
  <path d="M62 160h18" stroke="#F24DE7" stroke-width="6" stroke-linecap="round"/>
  <path d="M93 160h18l9-11 14 23 13-15h45" fill="none" stroke="#F24DE7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 203h140" stroke="#1A2A3B" stroke-width="5" stroke-linecap="round"/>
  <path d="M58 203h92" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
